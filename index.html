<body>
  <button id="search" class="search"><i class="fas fa-search"></i></button>
  <div id="slider">
    <p>drag me left and right frfr</p>

  </div>
</body>

<div class="container" id="container">
  <img src="assets/uomaps.jpg" alt='Logo'>

  <h3>Which floor is your start point?</h3>
  <select id="start-floor" class="floor_option1" name="floor_option1">
    <option id="ground_floor" name="ground_floor" value="Ground">Ground</option>
    <option id="first_floor" name="first_floor" value="First">First</option>
    <option id="second_floor" name="second_floor" value="Second">Second</option>
  </select>

  <br>
  <h3>Where is your start point?</h3>
  <input type="text" id="start-point" class="start_point" name="start" list="start-point-list">
  <datalist id="start-point-list"></datalist>

  <br>
  <h3>Which floor is your destination?</h3>
  <select id="dest-floor" class="floor_option" name="floor_option">
    <option id="ground_floor" name="ground_floor" value="Ground">Ground</option>
    <option id="first_floor" name="first_floor" value="First">First</option>
    <option id="second_floor" name="second_floor" value="Second">Second</option>
  </select>

  <h3>Select the room you want to go</h3>
  <input id="end-point" class="Rooms" name="room" list="end-point-list">
  <datalist id="end-point-list"></datalist>

  <h3>Wheelchair accessible?</h3>
  <input id="wheelchair" name="wheelchair" type="checkbox">

  <br>
  <button class="locate" id="locate">Locate</button>
</div>

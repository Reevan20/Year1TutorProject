<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="landing-page-styles.css">
    <title>Kilburn Locator</title>
    <script src="submit-data.js"></script>
</head>

<body>
    <div class="content">
        <h1>Which floor is your destination?</h1>

        <select class="floor_option" id = "floor_option">
            <option id="ground_floor">Ground Floor</option>
            <option id="first_floor">First Floor</option>
            <option id="second_floor">Second Floor</option>
        </select>

        <br>
        <input type="text" placeholder="Room" id = "room_option">
        <br>

        <button id="locate">Locate</button>
    </div>
</body>

</html>
